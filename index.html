<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DashEats</title>
<style>
  :root {
    --red: #eb1700; --red-dark: #c41300;
    --bg: #ffffff; --surface: #f6f6f6; --text: #191919; --muted: #6b6b6b; --line: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; cursor: pointer; }
  header {
    position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  }
  .logo { font-weight: 800; font-size: 22px; color: var(--red); cursor: pointer; white-space: nowrap; }
  .search { flex: 1; padding: 10px 14px; border-radius: 999px; border: none; background: var(--surface); font-size: 15px; min-width: 0; }
  .cart-btn { background: var(--red); color: #fff; border: none; border-radius: 999px; padding: 10px 16px; font-weight: 700; white-space: nowrap; }
  .cart-btn:hover { background: var(--red-dark); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 26px; margin: 8px 0 16px; }
  h2 { font-size: 20px; margin: 24px 0 12px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .chip { border: none; background: var(--surface); border-radius: 999px; padding: 8px 14px; white-space: nowrap; font-weight: 600; }
  .chip.active { background: var(--text); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .card { cursor: pointer; border-radius: 12px; overflow: hidden; transition: transform .15s; }
  .card:hover { transform: translateY(-3px); }
  .thumb { height: 140px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
  .card h3 { margin: 10px 0 2px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .hero { height: 180px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 90px; }
  .back { background: none; border: none; color: var(--muted); padding: 0; margin-bottom: 12px; font-weight: 600; }
  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .item { display: flex; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; align-items: center; }
  .item-info { flex: 1; min-width: 0; }
  .item-info h4 { margin: 0 0 4px; font-size: 15px; }
  .item-info p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
  .item-emoji { font-size: 40px; width: 64px; height: 64px; background: var(--surface); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .add { background: var(--surface); border: none; border-radius: 999px; width: 36px; height: 36px; font-size: 20px; font-weight: 700; flex-shrink: 0; }
  .add:hover { background: var(--line); }

  /* Cart drawer */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 20; }
  .overlay.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 100%); background: #fff; z-index: 30;
    transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { margin: 0; }
  .close { background: none; border: none; font-size: 24px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
  .drawer-foot { padding: 16px; border-top: 1px solid var(--line); }
  .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line-name { flex: 1; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #fff; }
  .row { display: flex; justify-content: space-between; margin: 6px 0; }
  .total { font-weight: 800; font-size: 18px; }
  .primary { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 999px; padding: 14px; font-weight: 700; font-size: 16px; margin-top: 10px; }
  .primary:hover { background: var(--red-dark); }
  .primary:disabled { background: #ccc; cursor: not-allowed; }

  /* Checkout */
  .checkout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
  @media (max-width: 760px) { .checkout { grid-template-columns: 1fr; } }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
  .tips { display: flex; gap: 8px; }
  .tips .chip { flex: 1; }
  .err { color: var(--red); font-size: 14px; margin-top: 8px; }
  .note { color: var(--muted); font-size: 13px; }

  .confirm { text-align: center; padding: 40px 16px; }
  .confirm .big { font-size: 80px; }
  .progress { height: 8px; background: var(--surface); border-radius: 999px; overflow: hidden; max-width: 420px; margin: 20px auto; }
  .progress div { height: 100%; width: 0; background: var(--red); transition: width 1s linear; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')">🛵 DashEats</div>
  <input class="search" id="search" placeholder="Search restaurants or food" oninput="state.query = this.value; go('home')">
  <button class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
</header>

<main id="app"></main>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h2>Your cart</h2><button class="close" onclick="closeCart()">×</button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
// ---------- Fake data ----------
const RESTAURANTS = [
  { id: 1, name: "Tony's Pizzeria", cuisine: "Pizza", emoji: "🍕", color: "#ffe3d6", rating: 4.7, time: "20–30 min", fee: 1.99,
    menu: [
      { id: 101, name: "Margherita Pizza", desc: "Tomato, mozzarella, basil", price: 14.99, emoji: "🍕" },
      { id: 102, name: "Pepperoni Pizza", desc: "Classic pepperoni with mozzarella", price: 16.49, emoji: "🍕" },
      { id: 103, name: "Garlic Knots (6)", desc: "Buttery, garlicky, warm", price: 5.99, emoji: "🥖" },
      { id: 104, name: "Caesar Salad", desc: "Romaine, parmesan, croutons", price: 8.99, emoji: "🥗" },
      { id: 105, name: "Cannoli", desc: "Ricotta filling, chocolate chips", price: 4.50, emoji: "🍰" } ] },
  { id: 2, name: "Burger Barn", cuisine: "Burgers", emoji: "🍔", color: "#fff1c9", rating: 4.5, time: "15–25 min", fee: 0.99,
    menu: [
      { id: 201, name: "Classic Cheeseburger", desc: "Beef patty, cheddar, pickles", price: 11.99, emoji: "🍔" },
      { id: 202, name: "Bacon BBQ Burger", desc: "Bacon, onion rings, BBQ sauce", price: 13.99, emoji: "🍔" },
      { id: 203, name: "Fries", desc: "Crispy and salted", price: 3.99, emoji: "🍟" },
      { id: 204, name: "Chocolate Shake", desc: "Thick and creamy", price: 5.49, emoji: "🥤" } ] },
  { id: 3, name: "Sakura Sushi", cuisine: "Japanese", emoji: "🍣", color: "#ffdce6", rating: 4.8, time: "30–40 min", fee: 2.99,
    menu: [
      { id: 301, name: "California Roll", desc: "Crab, avocado, cucumber", price: 8.99, emoji: "🍣" },
      { id: 302, name: "Spicy Tuna Roll", desc: "Tuna, spicy mayo, scallion", price: 9.99, emoji: "🍣" },
      { id: 303, name: "Chicken Ramen", desc: "Rich broth, egg, noodles", price: 14.49, emoji: "🍜" },
      { id: 304, name: "Miso Soup", desc: "Tofu, seaweed, scallion", price: 3.49, emoji: "🥣" },
      { id: 305, name: "Edamame", desc: "Steamed, sea salt", price: 4.99, emoji: "🫛" } ] },
  { id: 4, name: "Taco Fiesta", cuisine: "Mexican", emoji: "🌮", color: "#e3f5d6", rating: 4.6, time: "20–30 min", fee: 1.49,
    menu: [
      { id: 401, name: "Carne Asada Tacos (3)", desc: "Steak, onion, cilantro", price: 10.99, emoji: "🌮" },
      { id: 402, name: "Chicken Burrito", desc: "Rice, beans, salsa, cheese", price: 11.49, emoji: "🌯" },
      { id: 403, name: "Chips & Guac", desc: "Made fresh daily", price: 6.49, emoji: "🥑" },
      { id: 404, name: "Horchata", desc: "Sweet cinnamon rice drink", price: 3.49, emoji: "🥛" } ] },
  { id: 5, name: "Golden Wok", cuisine: "Chinese", emoji: "🥡", color: "#ffe9c2", rating: 4.4, time: "25–35 min", fee: 0.00,
    menu: [
      { id: 501, name: "General Tso's Chicken", desc: "Sweet, spicy, crispy", price: 13.99, emoji: "🍗" },
      { id: 502, name: "Vegetable Lo Mein", desc: "Stir-fried noodles", price: 10.99, emoji: "🍜" },
      { id: 503, name: "Pork Dumplings (6)", desc: "Pan-fried, soy dip", price: 7.99, emoji: "🥟" },
      { id: 504, name: "Egg Rolls (2)", desc: "Cabbage and pork", price: 4.49, emoji: "🥠" } ] },
  { id: 6, name: "Sweet Spot Bakery", cuisine: "Desserts", emoji: "🧁", color: "#f3e3ff", rating: 4.9, time: "10–20 min", fee: 1.99,
    menu: [
      { id: 601, name: "Red Velvet Cupcake", desc: "Cream cheese frosting", price: 3.99, emoji: "🧁" },
      { id: 602, name: "Chocolate Chip Cookie", desc: "Baked fresh", price: 2.49, emoji: "🍪" },
      { id: 603, name: "Glazed Donut", desc: "Classic and fluffy", price: 1.99, emoji: "🍩" },
      { id: 604, name: "Iced Latte", desc: "Espresso and milk over ice", price: 4.99, emoji: "☕" } ] }
];
const CATEGORIES = ["All", ...new Set(RESTAURANTS.map(r => r.cuisine))];
const SERVICE_FEE_RATE = 0.10, TAX_RATE = 0.08875;

// ---------- State ----------
const state = { page: "home", restaurantId: null, query: "", category: "All", tip: 3, priority: false,
                form: { name: "", address: "", phone: "" } };
let cart = loadCart(); // { restaurantId, items: { itemId: qty } }

function loadCart() {
  try { return JSON.parse(localStorage.getItem("dasheats-cart")) || { restaurantId: null, items: {} }; }
  catch { return { restaurantId: null, items: {} }; }
}
function saveCart() {
  try { localStorage.setItem("dasheats-cart", JSON.stringify(cart)); } catch {}
  renderCart();
}

const $ = id => document.getElementById(id);
const money = n => "$" + n.toFixed(2);
const findRestaurant = id => RESTAURANTS.find(r => r.id === id);
const findItem = (r, id) => r.menu.find(m => m.id === Number(id));

// ---------- Navigation ----------
function go(page, id) {
  state.page = page;
  if (id !== undefined) state.restaurantId = id;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const app = $("app");
  if (state.page === "home") app.innerHTML = homePage();
  else if (state.page === "store") app.innerHTML = storePage();
  else if (state.page === "checkout") app.innerHTML = checkoutPage();
  else if (state.page === "confirm") { app.innerHTML = confirmPage(); runTracker(); }
}

// ---------- Pages ----------
function homePage() {
  const q = state.query.toLowerCase();
  const list = RESTAURANTS.filter(r =>
    (state.category === "All" || r.cuisine === state.category) &&
    (!q || r.name.toLowerCase().includes(q) || r.cuisine.toLowerCase().includes(q) ||
      r.menu.some(m => m.name.toLowerCase().includes(q))));
  return `
    <h1>Restaurants near you</h1>
    <div class="chips">${CATEGORIES.map(c =>
      `<button class="chip ${c === state.category ? "active" : ""}" onclick="state.category='${c}'; render()">${c}</button>`).join("")}</div>
    <h2>${list.length} result${list.length === 1 ? "" : "s"}</h2>
    ${list.length ? `<div class="grid">${list.map(r => `
      <div class="card" onclick="go('store', ${r.id})">
        <div class="thumb" style="background:${r.color}">${r.emoji}</div>
        <h3>${r.name}</h3>
        <div class="meta">⭐ ${r.rating} · ${r.cuisine} · ${r.time}</div>
        <div class="meta">${r.fee === 0 ? "Free delivery" : money(r.fee) + " delivery fee"}</div>
      </div>`).join("")}</div>` : `<div class="empty">No restaurants match “${state.query}”.</div>`}`;
}

function storePage() {
  const r = findRestaurant(state.restaurantId);
  return `
    <button class="back" onclick="go('home')">← All restaurants</button>
    <div class="hero" style="background:${r.color}">${r.emoji}</div>
    <h1 style="margin-top:16px">${r.name}</h1>
    <div class="meta">⭐ ${r.rating} · ${r.cuisine} · ${r.time} · ${r.fee === 0 ? "Free delivery" : money(r.fee) + " delivery"}</div>
    <h2>Menu</h2>
    <div class="menu">${r.menu.map(m => `
      <div class="item">
        <div class="item-emoji">${m.emoji}</div>
        <div class="item-info"><h4>${m.name}</h4><p>${m.desc}</p><strong>${money(m.price)}</strong></div>
        <button class="add" title="Add to cart" onclick="addToCart(${r.id}, ${m.id})">+</button>
      </div>`).join("")}</div>`;
}

function checkoutPage() {
  const t = totals();
  if (!t) return `<div class="empty">Your cart is empty. <a href="#" onclick="go('home')">Browse restaurants</a></div>`;
  return `
    <button class="back" onclick="go('store', cart.restaurantId)">← Back to menu</button>
    <h1>Checkout</h1>
    <div class="checkout">
      <div>
        <div class="box">
          <h2 style="margin-top:0">Delivery details</h2>
          <label>Name</label><input id="name" placeholder="Jane Doe" value="${state.form.name}" oninput="state.form.name=this.value">
          <label>Address</label><input id="address" placeholder="1 Castle Point Terrace, Hoboken, NJ" value="${state.form.address}" oninput="state.form.address=this.value">
          <label>Phone</label><input id="phone" placeholder="(555) 123-4567" value="${state.form.phone}" oninput="state.form.phone=this.value">
          <label>Delivery option</label>
          <select id="speed" onchange="state.priority = this.selectedIndex === 1; render()">
            <option>Standard</option><option ${state.priority ? "selected" : ""}>Priority (+$2.99)</option></select>
        </div>
        <div class="box" style="margin-top:16px">
          <h2 style="margin-top:0">Payment</h2>
          <p class="note">This is a mock checkout. No real payment is taken, so don't enter real card details.</p>
          <select id="pay"><option>Demo Visa •••• 4242</option><option>Demo Apple Pay</option><option>Cash on delivery</option></select>
        </div>
      </div>
      <div class="box">
        <h2 style="margin-top:0">Order summary</h2>
        <div class="meta" style="margin-bottom:8px">${t.restaurant.name}</div>
        ${t.lines.map(l => `<div class="row"><span>${l.qty}× ${l.item.name}</span><span>${money(l.qty * l.item.price)}</span></div>`).join("")}
        <hr style="border:none;border-top:1px solid var(--line)">
        <div class="row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
        <div class="row"><span>Delivery fee</span><span>${money(t.delivery)}</span></div>
        <div class="row"><span>Service fee</span><span>${money(t.service)}</span></div>
        <div class="row"><span>Tax</span><span>${money(t.tax)}</span></div>
        <label>Dasher tip</label>
        <div class="tips">${[0, 3, 5, 8].map(v =>
          `<button class="chip ${state.tip === v ? "active" : ""}" onclick="state.tip=${v}; render()">${v ? "$" + v : "None"}</button>`).join("")}</div>
        <div class="row total" style="margin-top:14px"><span>Total</span><span>${money(t.total)}</span></div>
        <button class="primary" onclick="placeOrder()">Place order</button>
        <div class="err" id="err"></div>
      </div>
    </div>`;
}

function confirmPage() {
  const o = state.lastOrder;
  return `
    <div class="confirm">
      <div class="big">🛵</div>
      <h1>Order placed!</h1>
      <p>Thanks, ${o.name}. Your order from <strong>${o.restaurant}</strong> is on its way to ${o.address}.</p>
      <p class="meta">Order #${o.id} · Total ${money(o.total)}</p>
      <div class="progress"><div id="bar"></div></div>
      <p id="status"><strong>Restaurant is preparing your food…</strong></p>
      <button class="primary" style="max-width:300px" onclick="go('home')">Back to home</button>
    </div>`;
}

// ---------- Cart ----------
function addToCart(restaurantId, itemId) {
  if (cart.restaurantId && cart.restaurantId !== restaurantId && Object.keys(cart.items).length) {
    const other = findRestaurant(cart.restaurantId).name;
    if (!confirm(`Your cart has items from ${other}. Start a new cart?`)) return;
    cart = { restaurantId: null, items: {} };
  }
  cart.restaurantId = restaurantId;
  cart.items[itemId] = (cart.items[itemId] || 0) + 1;
  saveCart();
  toast("Added " + findItem(findRestaurant(restaurantId), itemId).name);
}

function changeQty(itemId, delta) {
  cart.items[itemId] += delta;
  if (cart.items[itemId] <= 0) delete cart.items[itemId];
  if (!Object.keys(cart.items).length) cart.restaurantId = null;
  saveCart();
  if (state.page === "checkout") render();
}

function totals() {
  if (!cart.restaurantId || !Object.keys(cart.items).length) return null;
  const restaurant = findRestaurant(cart.restaurantId);
  const lines = Object.entries(cart.items).map(([id, qty]) => ({ item: findItem(restaurant, id), qty }));
  const subtotal = lines.reduce((s, l) => s + l.qty * l.item.price, 0);
  const delivery = restaurant.fee + (state.priority ? 2.99 : 0);
  const service = subtotal * SERVICE_FEE_RATE;
  const tax = subtotal * TAX_RATE;
  const total = subtotal + delivery + service + tax + state.tip;
  return { restaurant, lines, subtotal, delivery, service, tax, total };
}

function renderCart() {
  const count = Object.values(cart.items).reduce((a, b) => a + b, 0);
  $("cartCount").textContent = count;
  const t = totals();
  if (!t) {
    $("cartBody").innerHTML = `<div class="empty">🛒<br>Your cart is empty</div>`;
    $("cartFoot").innerHTML = `<button class="primary" disabled>Checkout</button>`;
    return;
  }
  $("cartBody").innerHTML = `<div class="meta" style="margin-bottom:8px">From <strong>${t.restaurant.name}</strong></div>` +
    t.lines.map(l => `
      <div class="line">
        <span style="font-size:26px">${l.item.emoji}</span>
        <span class="line-name">${l.item.name}<br><span class="meta">${money(l.item.price)}</span></span>
        <span class="qty"><button onclick="changeQty(${l.item.id}, -1)">−</button>${l.qty}<button onclick="changeQty(${l.item.id}, 1)">+</button></span>
      </div>`).join("");
  $("cartFoot").innerHTML = `
    <div class="row"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div>
    <button class="primary" onclick="closeCart(); go('checkout')">Go to checkout</button>`;
}

function openCart() { $("drawer").classList.add("open"); $("overlay").classList.add("open"); }
function closeCart() { $("drawer").classList.remove("open"); $("overlay").classList.remove("open"); }

// ---------- Checkout ----------
function placeOrder() {
  const name = $("name").value.trim(), address = $("address").value.trim(), phone = $("phone").value.trim();
  if (!name || !address || !phone) { $("err").textContent = "Please fill in your name, address and phone."; return; }
  const t = totals();
  state.lastOrder = { id: Math.floor(100000 + Math.random() * 900000), name, address, restaurant: t.restaurant.name, total: t.total };
  cart = { restaurantId: null, items: {} };
  saveCart();
  go("confirm");
}

function runTracker() {
  const steps = ["Restaurant is preparing your food…", "Dasher picked up your order 🛵", "Dasher is nearby 📍", "Delivered! Enjoy your meal 🎉"];
  let i = 0;
  const tick = () => {
    if (state.page !== "confirm" || !$("bar")) return;
    $("bar").style.width = ((i + 1) / steps.length * 100) + "%";
    $("status").innerHTML = `<strong>${steps[i]}</strong>`;
    if (++i < steps.length) setTimeout(tick, 2500);
  };
  setTimeout(tick, 100);
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1500);
}

render();
renderCart();
</script>
</body>
</html>
